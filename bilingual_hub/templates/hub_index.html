<!DOCTYPE html>
<html lang="{{ 'zh-CN' if lang == 'zh' else 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ ui.title }}</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: rgba(255, 255, 255, 0.86);
      --border: rgba(148, 163, 184, 0.22);
      --text: #0f172a;
      --muted: #64748b;
      --teal: #0f766e;
      --indigo: #4f46e5;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(20, 184, 166, 0.14), transparent 28%),
        radial-gradient(circle at 85% 15%, rgba(79, 70, 229, 0.14), transparent 24%),
        linear-gradient(135deg, #f8fafc 0%, var(--bg) 100%);
    }
    .wrap {
      max-width: 1060px;
      margin: 0 auto;
      padding: 54px 24px 72px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 28px;
    }
    h1 {
      margin: 0;
      font-size: 44px;
      line-height: 1.08;
      letter-spacing: -0.04em;
    }
    .subtitle {
      margin-top: 10px;
      color: var(--muted);
      font-size: 15px;
    }
    .lang {
      display: inline-flex;
      gap: 8px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
    }
    .lang a {
      color: #334155;
      text-decoration: none;
      font-weight: 800;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 999px;
    }
    .lang a.active {
      background: #0f172a;
      color: #fff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .card {
      position: relative;
      overflow: hidden;
      min-height: 160px;
      padding: 22px;
      border-radius: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(12px);
    }
    .card::after {
      content: "";
      position: absolute;
      right: -42px;
      bottom: -42px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(20, 184, 166, .18), rgba(79, 70, 229, .16));
    }
    .name {
      position: relative;
      z-index: 1;
      font-size: 23px;
      font-weight: 900;
      margin-bottom: 12px;
    }
    .desc {
      position: relative;
      z-index: 1;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 22px;
    }
    .actions {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 92px;
      padding: 10px 14px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.14);
    }
    .play { background: linear-gradient(135deg, var(--teal), #06b6d4); }
    .map { background: linear-gradient(135deg, var(--indigo), #7c3aed); }
    @media (max-width: 760px) {
      .top { align-items: flex-start; flex-direction: column; }
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 36px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>{{ ui.title }}</h1>
        <div class="subtitle">{{ ui.subtitle }}</div>
      </div>
      <div class="lang">
        <a class="{{ 'active' if lang == 'zh' else '' }}" href="/zh">中文</a>
        <a class="{{ 'active' if lang == 'en' else '' }}" href="/en">English</a>
      </div>
    </div>
    <div class="grid">
      {% for g in games %}
      <div class="card">
        <div class="name">{{ g.name }}</div>
        <div class="desc">{{ g.desc }}</div>
        <div class="actions">
          <a class="play" href="{{ g.play_url }}">{{ ui.play }}</a>
          <a class="map" href="{{ g.map_url }}">{{ ui.map }}</a>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
